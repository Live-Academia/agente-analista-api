[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-agent-api"
version = "1.0.0"
description = "Deep Agent — Backend FastAPI + LangGraph + Streamlit para analise de dados com IA"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.12",
    # LangGraph + LLMs
    "langgraph>=0.4,<1.0",
    "langchain-anthropic>=0.3,<1.0",
    "langchain-openai>=0.3,<1.0",
    "langchain-core>=0.3,<1.0",
    # Data
    "pandas>=2.2,<3.0",
    "openpyxl>=3.1",
    "python-dotenv>=1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    # Data sources
    "gspread>=6.0",
    "google-auth>=2.0",
    "supabase>=2.0",
    "google-cloud-bigquery>=3.0",
    "db-dtypes>=1.0",
    # Google Sheets — retry
    "tenacity>=0.9",
    # Autenticacao FastAPI
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pyyaml>=6.0",
    # Streamlit frontend
    "streamlit>=1.40",
    "plotly>=5.24",
    "streamlit-authenticator>=0.4.2",
    # PDF export
    "fpdf2>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
