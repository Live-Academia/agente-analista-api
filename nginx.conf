events {}

http {
  server {
    listen 80;

    # FastAPI — API publica e documentacao
    location /api/ {
      proxy_pass http://127.0.0.1:8080/api/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /auth/ {
      proxy_pass http://127.0.0.1:8080/auth/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /docs {
      proxy_pass http://127.0.0.1:8080/docs;
      proxy_set_header Host $host;
    }
    location /openapi.json {
      proxy_pass http://127.0.0.1:8080/openapi.json;
    }
    location /redoc {
      proxy_pass http://127.0.0.1:8080/redoc;
      proxy_set_header Host $host;
    }
    location /health {
      proxy_pass http://127.0.0.1:8080/health;
    }

    # Streamlit UI — WebSocket obrigatorio para hot-reload e comunicacao em tempo real
    location / {
      proxy_pass http://127.0.0.1:8501;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 86400;
    }
  }
}
